name: Deploy E-Commerce to AWS EC2

on:
  push:
    branches:
      - main  # Ubah ke 'master' jika branch utama Anda bernama master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Masuk ke folder proyek di dalam EC2
            cd /home/ubuntu/ecommerce-project
            
            # Tarik kode terbaru dari GitHub
            git pull origin main
            
            # Bangun ulang image dan jalankan container di background
            docker-compose up -d --build